name: SingVerse 模型包发布
run-name: 发布模型包 ${{ github.event.release.tag_name }}

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: models-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    name: 构建模型下载与导入包
    if: ${{ !github.event.release.prerelease && !github.event.release.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: 检出发布标签对应的源码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 检查正式发布及对应源码
        run: python scripts/publish.py preflight --tag "$RELEASE_TAG"
      - name: 下载并校验固定版本的原始模型
        run: python scripts/models.py fetch
      - name: 安装隔离的瑞芯微模型转换工具
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --require-hashes -r requirements-rknn.lock
      - name: 转换 RK3566、RK3568 和 RK3588 模型
        run: .venv/bin/python scripts/models.py convert
      - name: 按用途和设备生成模型下载文件
        run: python scripts/models.py bundle --tag "$RELEASE_TAG" --output "dist/$RELEASE_TAG"
      - name: 保存完整发布文件以便失败重试
        uses: actions/upload-artifact@v4
        with:
          name: singverse-model-${{ github.event.release.tag_name }}
          path: dist/${{ github.event.release.tag_name }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  publish:
    name: 发布中文下载入口与模型指南
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: 检出发布标签对应的源码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 下载已构建的模型发布文件
        uses: actions/download-artifact@v4
        with:
          name: singverse-model-${{ github.event.release.tag_name }}
          path: dist/${{ github.event.release.tag_name }}
      - name: 上传模型并更新中文名称和下载指南
        run: python scripts/publish.py upload --tag "$RELEASE_TAG" --output "dist/$RELEASE_TAG"
